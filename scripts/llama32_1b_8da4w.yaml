# ExecuTorch LLM export config — Llama-3.2-1B-Instruct, 8-bit dynamic activations / 4-bit grouped weights, XNNPACK.
# Field names follow the ExecuTorch `export_llm` config schema; they have shifted between releases, so if the
# exporter rejects a key run `python -m executorch.extension.llm.export.export_llm --help` and the docs page
# for YOUR installed version (docs.pytorch.org/executorch/stable/llm/export-llm.html).
base:
  model_class: llama3_2
  checkpoint: models/llama3.2-1b-instruct/original/consolidated.00.pth
  params: models/llama3.2-1b-instruct/original/params.json
  tokenizer_path: models/llama3.2-1b-instruct/original/tokenizer.model
  metadata: '{"get_bos_id":128000, "get_eos_ids":[128009, 128001]}'
model:
  use_kv_cache: true
  use_sdpa_with_kv_cache: true
  dtype_override: fp32
quantization:
  qmode: 8da4w
  group_size: 32
  embedding_quantize: 8,0          # 8-bit per-channel embeddings (check the docs for the exact string format)
backend:
  xnnpack:
    enabled: true
    extended_ops: true
export:
  max_seq_length: 1024
  max_context_length: 1024
  output_dir: models/llama_et
  output_name: model.pte
